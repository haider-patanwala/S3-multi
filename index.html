<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP ships in the document because this app is a static bundle with no
      server to set headers. Notes on the loose-looking directives:
        connect-src https:  — the S3/R2/MinIO endpoint is user-configured, so
                              the host set is unknowable; https: still blocks
                              cleartext and ws:.
        style-src 'unsafe-inline' — Base UI positions popups by writing inline
                              style attributes.
        img/media blob:     — object previews are blob URLs.
      frame-ancestors cannot be set from a meta tag; set it (or
      X-Frame-Options) at the CDN. See docs/12-deployment.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src 'self' blob: data:; connect-src 'self' blob: https:"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Browser-only manager for S3-compatible object storage. Credentials stay encrypted in your browser."
    />
    <!-- Inline so a fresh deploy never 404s on /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='21' font-family='system-ui,sans-serif' font-size='13' font-weight='600' fill='%23fff' text-anchor='middle'%3ES3%3C/text%3E%3C/svg%3E"
    />
    <title>S3 Multi</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
